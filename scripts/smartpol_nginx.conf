# Nginx Configuration for SmartPol AI on Ubuntu
# Save to /etc/nginx/sites-available/smartpol and symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name your-server-ip-or-domain;

    client_max_body_size 20M;

    # Serve static files
    location /static/ {
        alias /var/www/smartpol_AI/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Serve media uploads
    location /media/ {
        alias /var/www/smartpol_AI/backend/media/;
    }

    # Proxy API requests to Gunicorn WSGI server
    location / {
        include proxy_params;
        proxy_pass http://unix:/run/gunicorn.sock;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
